name: CI

on:
  push:
    branches: 
      - '*'
    tags:
      - v*
  pull_request:
  repository_dispatch:
    types: [run_build]
  workflow_dispatch: {}

# Using several artifacts because there is an existing issue
# https://github.com/actions/upload-artifact/issues/478

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/pspdev/pspdev:latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        apk add make git bash
    
    - name: Compile project
      run: |
        make clean all

    - name: Get short SHA
      id: slug
      run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: gprof-binary-${{ steps.slug.outputs.sha8 }}
        path: | 
          EBOOT.PBP
          gprof.elf

  execute:
    needs: [build]
    runs-on: ubuntu-latest
    container: ghcr.io/hrydgard/ppsspp:latest

    steps:
    - name: Get short SHA
      id: slug
      run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: gprof-binary-${{ steps.slug.outputs.sha8 }}
    
    - name: Execute ELF
      run: |
        PPSSPPHeadless $(pwd)/EBOOT.PBP --log
      
    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: gprof-gmon-${{ steps.slug.outputs.sha8 }}
        path: | 
          gmon.out
      
  generate_report:
    needs: [execute]
    runs-on: ubuntu-latest
    container: ghcr.io/pspdev/pspdev:latest

    steps:
    - name: Get short SHA
      id: slug
      run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

    - name: Download artifact binary
      uses: actions/download-artifact@v4
      with:
        name: gprof-binary-${{ steps.slug.outputs.sha8 }}
  
    - name: Download artifact gmon
      uses: actions/download-artifact@v4
      with:
        name: gprof-gmon-${{ steps.slug.outputs.sha8 }}
    
    - name: Generate report
      run: |
        psp-gprof -b gprof.elf gmon.out > report.txt
        cat report.txt

    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: gprof-report-${{ steps.slug.outputs.sha8 }}
        path: | 
          report.txt